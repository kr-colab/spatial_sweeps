[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacefreq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-allel",
    "scipy",
    "typer[all]",
    "rich",
    "pyproj",
    "shapely",
]

[project.scripts]
spacefreq = "spacefreq.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["spacefreq"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
